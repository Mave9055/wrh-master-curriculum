title: "WRH Master Curriculum"
description: "What Really Happened™ Master Curriculum — 77-session non-clinical education for survival literacy, systems navigation, resilience, and safe facilitation."
author: "Daniel Bret Lingar / Capitol Contracts LLC"

url: "https://daniel-lingar.github.io"
baseurl: "/wrh-master-curriculum"

repository: "daniel-lingar/wrh-master-curriculum"

lang: "en"
timezone: "America/Chicago"

theme: null
plugins: []

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

permalink: pretty

include:
  - index.html
  - curriculum/session-viewer.html
  - assets/data
  - robots.txt
  - sitemap.xml
  - site.webmanifest

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
  - gemfiles

defaults:
  - scope:
      path: ""
    values:
      layout: null
