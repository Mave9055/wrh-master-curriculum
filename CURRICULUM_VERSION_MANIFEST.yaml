schema_version: 1
curriculum:
  name: "What Really Happened (WRH)"
  authoritative_session_count: 76
  authoritative_repository: "daniel-lingar/wrh-master-curriculum"
  status: "current"
  rule: "The 76-session count is authoritative for the master curriculum. Smaller counts may describe a scoped pilot, legacy short-form sequence, supplemental module, or historical artifact only when explicitly labeled."

support_repositories:
  - name: "WRH-Pilot-Deployment-Package"
    role: "scoped pilot deployment package"
    count_rule: "30-session references describe the active pilot subset, not the full 76-session master curriculum."
  - name: "capitol-contracts"
    role: "business, contracting, grant, federal, and capability materials"
    count_rule: "30-session and 18-module references must be labeled as scoped pilot/commercial or grant-framework material, not as the full master curriculum."

